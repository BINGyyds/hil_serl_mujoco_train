[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hil_serl_train"
version = "0.1.0"
description = "Training-side repository for MuJoCo-based HIL-SERL experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "absl-py>=0.12.0",
  "chex>=0.1.85",
  "distrax>=0.1.2",
  "einops>=0.6.1",
  "flax>=0.8.0",
  "gymnasium==0.29.1",
  "imageio>=2.31.1",
  "lz4",
  "matplotlib",
  "ml_collections>=0.1.0",
  "moviepy>=1.0.3",
  "mujoco>=3.0.0",
  "natsort",
  "numpy>=1.24.3",
  "opencv-python",
  "optax>=0.1.5",
  "pynput",
  "scipy==1.11.4",
  "tensorflow>=2.15.0",
  "tensorflow_probability>=0.23.0",
  "tf-keras",
  "tomli>=2.0.1",
  "tqdm>=4.60.0",
  "typing_extensions",
  "wandb>=0.12.14",
]

[project.optional-dependencies]
distributed = [
  "pyzmq",
  "agentlace @ git+https://github.com/youliangtan/agentlace.git@cf2c337c5e3694cdbfc14831b239bd657bc4894d",
]
sb3 = [
  "stable-baselines3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["serl_launcher*"]
